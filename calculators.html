<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1c2c" />
  <title>Calculadoras e Scores</title>
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/pico.min.css">
  <style>
    :root[data-theme="dark"]{
      --pico-background-color:#0b1c2c;--pico-card-background-color:rgba(255,255,255,.06);
      --pico-card-sectioning-background-color:rgba(255,255,255,.04);
      --pico-primary:#d4af37;--pico-primary-background:#d4af37;--pico-primary-border:#d4af37;
      --pico-primary-hover:#e6c453;--pico-primary-hover-background:#e6c453;--pico-primary-hover-border:#e6c453;
      --pico-primary-underline:rgba(212,175,55,.5);--pico-primary-inverse:#0b1c2c;
      --pico-secondary:#cfcfcf;--pico-secondary-border:rgba(255,255,255,.25);
      --pico-form-element-background-color:rgba(255,255,255,.92);--pico-form-element-color:#0b1c2c;
      --pico-form-element-placeholder-color:#6b7785;
    }
    header.top{display:flex;align-items:center;gap:12px;padding:1rem 0 .5rem}
    .logo{width:44px;height:44px;border-radius:12px;border:1px solid rgba(212,175,55,.35);
      display:grid;place-items:center;font-weight:800;color:#d4af37;flex-shrink:0}
    header.top h1{font-size:1.4rem;margin:0;color:#d4af37}
    header.top p{margin:0;font-size:.85rem;color:#cfcfcf}
    header.top .grow{flex:1}
    .chip{padding:.35rem .8rem;font-size:.9rem;margin:0;width:auto}
    .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
    details.grp summary,details.grp[open]>summary{font-weight:700;color:#d4af37;font-size:.9rem;margin-bottom:.5rem}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
    @media(max-width:640px){.fields{grid-template-columns:1fr}}
    .result-box{margin-top:.75rem}
    .result-box .t{font-size:.8rem;color:#cfcfcf}
    .result-box .v{font-size:1.6rem;font-weight:800}
    .result-box .u{font-size:.8rem;color:#cfcfcf;font-weight:400}
    .small{font-size:.8rem;color:#cfcfcf}
    .star{float:right}
    .title{font-weight:700;color:#d4af37;margin-bottom:1rem}
    .actions{display:flex;gap:.75rem;flex-wrap:wrap}
    .actions button{width:auto;margin:0}
    @media print{.chips,#search,.actions{display:none!important}}
  </style>
</head>
<body>
<main class="container">
  <header class="top">
    <div class="logo">KN</div>
    <div class="grow">
      <h1 id="title">Calculadoras e Scores</h1>
      <p id="sub"></p>
    </div>
    <button class="chip outline secondary" id="langBtn">English</button>
  </header>
  <a id="back" href="index.html" class="small">← Estimativa metabólica</a>
  <article>
    <input id="search" type="search" />
    <div id="list"></div>
  </article>
  <article id="form"></article>
  <div id="result"></div>
  <p class="small" id="disclaimer"></p>
</main>
<script src="js/scores.js"></script>
<script src="js/calculators.js"></script>
</body>
</html>
