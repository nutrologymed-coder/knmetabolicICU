name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Guard against committed secrets
        run: |
          if git grep -nEI '(sb_secret_|service_role|SUPABASE_SERVICE|BEGIN (RSA |EC )?PRIVATE KEY|cloudflare_api_token\s*[:=]\s*[A-Za-z0-9_-]{20,})' -- . ':!docs' ':!.github' ':!supabase' ':!tests' ':!SECURITY.md'; then
            echo "Possible secret committed"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL 16 + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
      - run: scripts/test-db.sh
        env:
          PGHOST: /var/run/postgresql
