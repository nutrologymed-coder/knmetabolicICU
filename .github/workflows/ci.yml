# Único workflow do repositório (uso mínimo de Actions): roda só em pull requests.
# Deploy e previews são feitos pela integração Git do Cloudflare Pages (sem minutos de Actions).
name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test && npm run build
      - name: Guard against committed secrets
        run: |
          if git grep -nEI '(sb_secret_|service_role|SUPABASE_SERVICE|BEGIN (RSA |EC )?PRIVATE KEY|cloudflare_api_token\s*[:=]\s*[A-Za-z0-9_-]{20,})' -- . ':!docs' ':!.github' ':!supabase' ':!tests' ':!SECURITY.md'; then
            echo "Possible secret committed"; exit 1; fi
      # Banco só é testado quando algo relacionado muda (economiza ~1 min por PR).
      - name: Detect database changes
        id: db
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(supabase/|scripts/test-db\.sh)'; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install PostgreSQL 16 + pgTAP
        if: steps.db.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgtap
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"
      - name: Database tests (pgTAP)
        if: steps.db.outputs.run == 'true'
        run: scripts/test-db.sh
        env:
          PGHOST: /var/run/postgresql
