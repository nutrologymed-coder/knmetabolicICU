# Supabase CLI config (local development). Remote projects are configured in the dashboard / via CI secrets.
project_id = "knmetabolic"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 200

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
